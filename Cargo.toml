[package]
name = "maddy"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "A small, fast compiler from Markdown with LaTeX-style mathematics to PDF documents and presentations"
license = "MIT"
repository = "https://github.com/jeppejohansen/maddy"
readme = "README.md"
keywords = ["markdown", "latex", "math", "pdf", "typst"]
categories = ["command-line-utilities", "text-processing"]

[[bin]]
name = "maddy"
path = "src/main.rs"

[lib]
name = "maddy"
path = "src/lib.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
pulldown-cmark = { version = "0.13", default-features = false, features = ["simd"] }
ratex-parser = "0.1.14"
serde = { version = "1.0", features = ["derive"] }
serde_yaml_ng = "0.10"
toml = "1.1"
thiserror = "2.0"
ratex-font = "0.1.14"
typst = "0.15.1"
typst-pdf = "0.15.1"
typst-assets = { version = "0.15.1", features = ["fonts"] }
comemo = "0.5"
typst-layout = "0.15.1"
typst-kit = { version = "0.15.1", default-features = false, features = ["scan-fonts", "embedded-fonts"] }

[dev-dependencies]
assert_cmd = "2.2"
predicates = "3.1"
tempfile = "3.27"

[profile.release]
lto = true
codegen-units = 1
strip = true
